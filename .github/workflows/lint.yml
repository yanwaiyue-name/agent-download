name: PowerShell lint

on:
  push:
    branches: [master]
    paths:
      - '**.ps1'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  puff:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: 语法解析（所有 .ps1）
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$err)
            if ($err -and $err.Count -gt 0) {
              foreach ($e in $err) {
                Write-Host ("::error file=" + $_.FullName + ",line=" + $e.Extent.StartLineNumber + "::" + $e.Message)
              }
              $fail++
            }
          }
          if ($fail -gt 0) { throw "$fail 个脚本存在语法错误" }
          Write-Host '全部脚本语法通过'

      - name: PSScriptAnalyzer 规则检查（Error 阻断，Warning 只报告）
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          if ($results) {
            $results | Select-Object RuleName, Severity, ScriptName, Line, Message | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
            if ($errors.Count -gt 0) { throw ("存在 " + $errors.Count + " 个 Error 级问题") }
          } else { Write-Host 'PSScriptAnalyzer 无问题' }
