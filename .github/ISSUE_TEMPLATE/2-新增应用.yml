name: 推荐新应用
description: 提交一个应被收录的 AI 客户端或开发工具
title: "[新增] "
labels: ["新应用"]
body:
  - type: input
    id: name
    attributes:
      label: 应用名称
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 官方网站
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: group
    attributes:
      label: 分组
      options:
        - 桌面端
        - IDE
        - CLI Code
        - Agents
        - 开发环境
        - 运行环境
        - 本地运行
        - 实用工具
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 支持平台
      placeholder: 例：Windows / macOS / Linux
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这不是我的推广项目，链接里没有邀请码或返利参数
          required: true
        - label: 我确认它有官方发布渠道（官网或官方 GitHub Release）
          required: true
