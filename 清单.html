let state = { q: '', arch: 'x64', group: '全部' };

const FORMAT_LABEL = { msi:'MSI', setup:'安装版', store:'商店版', portable:'免安装', zip:'压缩包', dmg:'dmg' };

function archBadges(a){
  const out = [];
  const has64  = a.win.some(v=>v.arch==='x64');
  const hasArm = a.win.some(v=>v.arch==='arm64');
  const hasMac = a.mac.length > 0;
  if (has64)  out.push('<span class="pill x64">x64</span>');
  if (hasArm) out.push('<span class="pill arm">ARM64 原生</span>');
  if (hasMac) out.push('<span class="pill mac">macOS</span>');
  return out.join(' ');
}

function pickVariants(a){
  if (state.arch === 'mac') return a.mac;
  const want = state.arch === 'arm64' ? 'arm64' : 'x64';
  const exact = a.win.filter(v=>v.arch===want);
  if (exact.length) return exact;
  // ARM64 没有原生版 → 回退 x64 并标注
  if (want==='arm64') {
    return a.win.filter(v=>v.arch==='x64').map(v=>Object.assign({},v,{__emulated:true}));
  }
  return [];
}

function card(a){
  const vs = pickVariants(a);
  const fmtPills = vs.map(v=>{
    const lab = FORMAT_LABEL[v.format] || v.format;
    const sz = v.size ? ' · '+v.size : '';
    const em = v.__emulated ? ' ⚠️模拟' : '';
    return '<span class="pill">'+lab+sz+em+'</span>';
  }).join(' ');

  const pageBtn = a.page
    ? '<a class="btn primary" href="'+a.page+'" target="_blank" rel="noopener">官方页 ↗</a>'
    : '';

  const dlBtn = vs.length && vs[0].urls && vs[0].urls.length
    ? '<a class="btn" href="'+vs[0].urls[0]+'" target="_blank" rel="noopener">直链</a>'
    : '';

  const tip = a.tip ? '<div class="tip">'+a.tip+'</div>' : '';

  return '<div class="card">'
    + '<h3>'+a.name
      + (a.recommend?'<span class="badge b-rec">推荐</span>':'')
      + '<span class="badge b-grp">'+a.group+'</span>'
    + '</h3>'
    + '<div class="desc">'+(a.desc||'')+'</div>'
    + '<div class="meta">'+archBadges(a)+'</div>'
    + (fmtPills?'<div class="meta">'+fmtPills+'</div>':'')
    + tip
    + '<div class="links">'+pageBtn+dlBtn+'</div>'
  + '</div>';
}

function render(){
  const q = state.q.trim().toLowerCase();
  const list = APPS.filter(a=>{
    if (state.group !== '全部' && a.group !== state.group) return false;
    if (!q) return true;
    const hay = (a.name+' '+(a.vendor||'')+' '+a.desc+' '+(a.reason||'')+' '+a.id).toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = list.map(card).join('');
  empty.style.display = list.length ? 'none' : 'block';
}

function initChips(){
  const groups = ['全部'];
  APPS.forEach(a=>{ if(groups.indexOf(a.group)<0) groups.push(a.group); });
  const box = document.getElementById('chips');
  box.innerHTML = groups.map(g=>'<button class="chip'+(g==='全部'?' on':'')+'" data-g="'+g+'">'+g+'</button>').join('');
  box.querySelectorAll('.chip').forEach(b=>{
    b.onclick = ()=>{
      box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      state.group = b.dataset.g;
      render();
    };
  });
}

document.getElementById('q').oninput = e=>{ state.q = e.target.value; render(); };

document.getElementById('archSeg').querySelectorAll('button').forEach(b=>{
  b.onclick = ()=>{
    document.getElementById('archSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    state.arch = b.dataset.arch;
    render();
  };
});

initChips();
render();
</script>
